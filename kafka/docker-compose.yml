services:
  spark-master:
    image: jpazzini/mapd-b:spark-master
    container_name: spark-master
    ports:
      - 8080:8080
      - 7077:7077
    volumes:
      - $PWD:/mapd-workspace
  spark-worker:
    image: jpazzini/mapd-b:spark-worker
    depends_on:
      - spark-master
    volumes:
      - $PWD:/mapd-workspace
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=512m
  kafka-broker:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_HOME: /opt/kafka/
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka-broker:9092,CONTROLLER://kafka-broker:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
  jupyter-notebook:
    image: jpazzini/mapd-b:spark-jupyter
    container_name: jupyter-notebook
    depends_on:
      - spark-master
    ports:
      - 4040:4040
      - 1234:8888
    volumes:
      - $PWD:/mapd-workspace
